org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# org.gradle.java.home was pinned to C:\Program Files\Android\openjdk\jdk-21.0.8,
# an absolute Windows path, in a tracked file. Gradle rejects it outright on any
# other host - "Java home supplied is invalid" - before it reads a single build
# script, so it stopped every non-Windows contributor one step past the missing
# gradlew. It is per-machine configuration and belongs in the user's own
# ~/.gradle/gradle.properties (%USERPROFILE%\.gradle\gradle.properties on
# Windows), not here. Unset, Gradle uses JAVA_HOME or the launching JVM.
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
